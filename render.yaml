# Render Blueprint for the WindyMail backend (ADR-012: free tier + keep-warm ping).
# Mirrors the live service "windymail-backend" (https://windymail-backend.onrender.com).
# Secrets are never set here; add them in the Render dashboard (Environment tab).
services:
  - type: web
    name: windymail-backend
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: ENABLE_API_DOCS
        value: "false"
      # Required: expected "aud" of the add-on's ID token (ADR-011). Set in the dashboard.
      - key: GOOGLE_CLIENT_ID
        sync: false
      # LLM step (ADR-019). Set in the dashboard, with a spend limit on the key in the
      # Anthropic Console. Without it the backend runs on its rules only (partial).
      - key: ANTHROPIC_API_KEY
        sync: false
      # Set to false to turn the LLM step off without a deploy.
      - key: LLM_ENABLED
        value: "true"
